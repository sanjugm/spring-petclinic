trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

- stage: Security
  displayName: "Security Scan"
  jobs:
  - job: Gitleaks
    displayName: "Gitleaks Secret Scan"
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        sudo apt-get update
        sudo apt-get install -y gitleaks
        gitleaks detect --source . --redact --verbose
      displayName: "Run Gitleaks"


- stage: Lint
  displayName: "Lint"
  dependsOn: Security
  jobs:
  - job: Checkstyle
    displayName: "Maven Checkstyle"
    steps:
    - checkout: self

    - task: JavaToolInstaller@0
      displayName: "Setup Java 17"
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"
      displayName: "Verify Java 17"

    - task: Maven@4
      displayName: "Run Maven Validate / Checkstyle"
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'validate'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '17'
        mavenVersionOption: 'Default'


- stage: Build
  displayName: "Build and Test"
  dependsOn: Lint
  jobs:
  - job: MavenBuild
    displayName: "Maven Build"
    steps:
    - checkout: self

    - task: JavaToolInstaller@0
      displayName: "Setup Java 17"
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"
        mvn -version
      displayName: "Verify Java and Maven"

    - task: Maven@4
      displayName: "Maven Clean Verify"
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '17'
        mavenVersionOption: 'Default'

    - script: |
        echo "Generated artifacts:"
        ls -lh target/
      displayName: "Verify Build Artifact"

    - task: PublishPipelineArtifact@1
      displayName: "Publish Versioned Artifact"
      inputs:
        targetPath: '$(Build.SourcesDirectory)/target'
        artifact: 'spring-petclinic-$(Build.BuildNumber)'
        publishLocation: 'pipeline'


- stage: Terraform
  displayName: "Terraform Validation"
  dependsOn: Build
  jobs:
  - job: Terraform
    displayName: "Terraform Init Validate Plan"

    variables:
    - group: terraform-secrets

    steps:
    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common wget

        wget -O- https://apt.releases.hashicorp.com/gpg | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
          https://apt.releases.hashicorp.com \
          $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list

        sudo apt-get update
        sudo apt-get install -y terraform

        terraform version
      displayName: "Install Terraform"

    - script: |
        cd terraform
        terraform fmt -check
      displayName: "Terraform Format Check"

    - script: |
        cd terraform
        terraform init
      displayName: "Terraform Init"

    - script: |
        cd terraform
        terraform validate
      displayName: "Terraform Validate"
      env:
        TF_VAR_ssh_public_key: $(ssh_public_key)

    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: 'sc-petclinic-azure'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          cd terraform
          terraform plan
      env:
        TF_VAR_ssh_public_key: $(ssh_public_key)